<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Auto Clipper – viral clips, Full HD, free</title>
<meta name="description" content="Upload a video, AI finds the best hook-first moments and exports Full HD clips in 9:16, 16:9, 1:1 or 3:4 with a viral score. Runs in your browser.">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0e1116;color:#e8eaed;font-family:system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:18px}
h1{margin:.2em 0}small,.muted{color:#9aa0a6}
.box{background:#171b22;border:1px solid #2a303b;border-radius:12px;padding:14px;margin:12px 0}
label{display:inline-block;margin:6px 12px 6px 0}
input,select{background:#0e1116;color:#e8eaed;border:1px solid #3a4150;border-radius:8px;padding:7px}
button,.dl{background:#6d5efc;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5}progress{width:100%;height:10px}
.card{display:flex;gap:14px;flex-wrap:wrap}.card video{max-width:260px;max-height:340px;border-radius:8px;background:#000}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:700;color:#000}
</style></head><body><main>
<h1>AI Auto Clipper</h1>
<p class="muted">Free • runs in your browser • video never leaves your device (only transcript text goes to the AI).</p>
<div class="box">
<input type="file" id="file" accept="video/*"><br>
<label>Ratio <select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option><option>3:4</option></select></label>
<label>Clips <input type="number" id="n" value="5" min="1" max="10" style="width:56px"></label>
<label>Min s <input type="number" id="minL" value="20" min="8" style="width:56px"></label>
<label>Max s <input type="number" id="maxL" value="45" max="120" style="width:56px"></label>
<label>Language <select id="lang"><option value="">Auto</option><option value="english">English</option><option value="urdu">Urdu</option><option value="hindi">Hindi</option></select></label>
<label>Whisper <select id="wm"><option value="tiny">tiny (fast)</option><option value="base">base (better)</option></select></label><br>
<label>Gemini API key (optional, free from aistudio.google.com – best accuracy) <input id="key" type="password" placeholder="AIza..." style="width:230px"></label><br><br>
<button id="go">Create clips</button>
<p id="st" class="muted"></p><progress id="bar" value="0" max="100"></progress>
</div>
<div id="out"></div>
<small class="muted">Output: Full HD (1080p-class), H.264. Only use videos you have rights to. Processing 1080p in-browser takes a few minutes per clip.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script type="module">
import {pipeline} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm';
const $=id=>document.getElementById(id), st=(m,p)=>{$('st').textContent=m;if(p!=null)$('bar').value=p};
const R={'9:16':[1080,1920],'16:9':[1920,1080],'1:1':[1080,1080],'3:4':[1080,1440]};
$('key').value=localStorage.getItem('gk')||'';
let ff;
async function loadFF(){
  if(ff)return ff;const {FFmpeg}=FFmpegWASM,{toBlobURL}=FFmpegUtil;ff=new FFmpeg();
  ff.on('progress',({progress})=>{if(progress>0&&progress<=1)st('Rendering clip... '+Math.round(progress*100)+'%')});
  const b='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/';
  st('Loading video engine...');
  await ff.load({classWorkerURL:await toBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js','text/javascript'),
    coreURL:await toBlobURL(b+'ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(b+'ffmpeg-core.wasm','application/wasm')});
  return ff;
}
async function getAudio(f,file){
  await f.writeFile('in.mp4',await FFmpegUtil.fetchFile(file));
  await f.exec(['-i','in.mp4','-vn','-ac','1','-ar','16000','-c:a','pcm_s16le','a.wav']);
  const d=await f.readFile('a.wav'),v=new DataView(d.buffer,d.byteOffset,d.length);let o=12;
  while(o<d.length-8){const id=String.fromCharCode(d[o],d[o+1],d[o+2],d[o+3]),sz=v.getUint32(o+4,true);if(id==='data'){o+=8;break}o+=8+sz}
  const n=Math.floor((d.length-o)/2),a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=v.getInt16(o+i*2,true)/32768;
  await f.deleteFile('a.wav');return a;
}
async function transcribe(a,lang,m){
  const asr=await pipeline('automatic-speech-recognition','Xenova/whisper-'+m,{progress_callback:p=>{if(p.status==='progress')st('Downloading speech model '+Math.round(p.progress)+'%')}});
  st('Transcribing speech (free, in-browser)...');
  const o=await asr(a,{chunk_length_s:30,stride_length_s:5,return_timestamps:true,task:'transcribe',...(lang?{language:lang}:{})});
  return o.chunks.map(c=>({s:c.timestamp[0],e:c.timestamp[1]??c.timestamp[0]+3,t:c.text.trim()})).filter(c=>c.t);
}
function mkPrompt(segs,n,mn,mx){
  return `You are a viral short-form video editor. Below is a timestamped transcript (seconds). Pick the ${n} best clips for TikTok/Reels/Shorts.
Rules: each clip ${mn}-${mx} seconds; each MUST start exactly at a segment start time whose sentence is a strong scroll-stopping hook (shocking claim, bold statement, question, curiosity gap, story opener); clip must be self-contained and end at a natural sentence end; no overlaps.
Return ONLY a JSON array: [{"start":number,"end":number,"title":string,"hook":string (the opening line),"score":integer 0-100 (viral potential, be honest, not all high),"reason":string (one short sentence)}] sorted by score desc. Write title/reason in the transcript's language.

TRANSCRIPT:
`+segs.map(c=>`[${Math.round(c.s)}] ${c.t}`).join('\n').slice(0,90000);
}
async function askAI(p,key){
  if(key){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:{responseMimeType:'application/json'}})});
    return (await r.json()).candidates[0].content.parts[0].text;
  }
  const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'user',content:p}]})});
  return (await r.json()).choices[0].message.content;
}
function heuristic(a,n,mn,mx){
  const sr=16000,secs=Math.floor(a.length/sr),len=Math.min(Math.round((mn+mx)/2),secs),rms=[];
  for(let s=0;s<secs;s++){let t=0;for(let i=s*sr;i<(s+1)*sr;i+=8)t+=a[i]*a[i];rms.push(Math.sqrt(t/(sr/8)))}
  const sc=[];for(let s=0;s+len<=secs;s++){let t=0;for(let k=0;k<len;k++)t+=rms[s+k];sc.push([s,t])}
  sc.sort((x,y)=>y[1]-x[1]);const top=sc[0]?sc[0][1]:1,out=[];
  for(const [s,t] of sc){if(out.length>=n)break;if(out.every(c=>Math.abs(c.start-s)>=len))out.push({start:s,end:s+len,title:'High-energy moment',hook:'(AI unavailable – picked by audio energy)',score:Math.round(40+40*t/top),reason:'Estimated from loudness only.'})}
  return out;
}
function fix(c,segs,dur,mn,mx){
  let s=+c.start;if(segs.length){const nr=segs.reduce((b,x)=>Math.abs(x.s-s)<Math.abs(b.s-s)?x:b);if(Math.abs(nr.s-s)<4)s=nr.s}
  s=Math.max(0,s);let e=Math.min(Math.max(+c.end||s+mn,s+mn),s+mx,dur);return {...c,start:s,end:e};
}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
$('go').onclick=async()=>{
  const file=$('file').files[0];if(!file)return st('Select a video first.');
  const n=+$('n').value,mn=+$('minL').value,mx=+$('maxL').value,ratio=$('ratio').value,key=$('key').value.trim();
  localStorage.setItem('gk',key);$('out').innerHTML='';$('go').disabled=true;
  try{
    const f=await loadFF();st('Extracting audio...',5);const a=await getAudio(f,file),dur=a.length/16000;
    let segs=[],clips=[];
    try{
      segs=await transcribe(a,$('lang').value,$('wm').value);st('AI is finding hooks & viral moments...',40);
      const txt=await askAI(mkPrompt(segs,n,mn,mx),key);
      clips=JSON.parse(txt.match(/\[[\s\S]*\]/)[0]);
    }catch(e){console.warn(e);st('AI unavailable, using audio-energy fallback...');clips=heuristic(a,n,mn,mx)}
    clips=clips.map(c=>fix(c,segs,dur,mn,mx)).filter((c,i,arr)=>c.end-c.start>=5&&arr.slice(0,i).every(p=>c.start>=p.end||c.end<=p.start)).slice(0,n);
    const [W,H]=R[ratio];
    for(let i=0;i<clips.length;i++){
      const c=clips[i],out='c'+i+'.mp4';st(`Rendering clip ${i+1}/${clips.length} (${W}x${H})...`,50+45*i/clips.length);
      await f.exec(['-ss',c.start.toFixed(2),'-i','in.mp4','-t',(c.end-c.start).toFixed(2),'-vf',`scale=${W}:${H}:force_original_aspect_ratio=increase,crop=${W}:${H},setsar=1`,'-c:v','libx264','-preset','ultrafast','-crf','20','-pix_fmt','yuv420p','-c:a','aac','-b:a','160k','-movflags','+faststart',out]);
      const url=URL.createObjectURL(new Blob([(await f.readFile(out)).buffer],{type:'video/mp4'}));await f.deleteFile(out);
      const col=c.score>=80?'#34d399':c.score>=60?'#fbbf24':'#9aa0a6',d=document.createElement('div');d.className='box card';
      const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
      d.innerHTML=`<video controls src="${url}"></video><div style="flex:1;min-width:200px"><h3 style="margin:0">${i+1}. ${esc(c.title)}</h3>
      <p><span class="badge" style="background:${col}">Viral potential ${Math.round(c.score)}/100</span></p>
      <p><b>Hook:</b> “${esc(c.hook)}”</p><p class="muted">${esc(c.reason)}<br>Source: ${fmt(c.start)} – ${fmt(c.end)} • ${ratio} • Full HD</p>
      <a class="dl" href="${url}" download="clip-${i+1}-${ratio.replace(':','x')}.mp4">Download</a></div>`;
      $('out').appendChild(d);
    }
    await f.deleteFile('in.mp4');st('Done! Download buttons are on each clip.',100);
  }catch(e){st('Error: '+e.message)}
  $('go').disabled=false;
};
</script></body></html>
